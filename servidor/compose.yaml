services:
  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_TOKEN=${API_TOKEN}
    volumes:
      - datos:/data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  datos:
